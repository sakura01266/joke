<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 关键：适配手机屏幕，禁止缩放，看起来像原生 App -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- 浏览器标签栏的标题 -->
    <title>学习资源</title>
    <style>
        /* 基础重置，消除默认边距 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent; /* 去掉手机点击时的蓝色高亮 */
        }

        body {
            /* 使用系统默认字体，看起来更自然 */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            /* 页面背景设为柔和的浅灰色 */
            background-color: #f5f7fa;
            /* 使用 flex 布局让按钮垂直水平居中 */
            display: flex;
            justify-content: center;
            align-items: center;
            /* 让 body 至少占满整个屏幕高度 */
            min-height: 100vh;
            /* 防止页面滚动（如果内容不多的话） */
            overflow: hidden;
        }

        /* 绿色按钮样式 */
        .get-resource-btn {
            /* 按钮尺寸，手指容易点击 */
            padding: 18px 48px;
            font-size: 18px;
            font-weight: 600;
            color: #ffffff;
            /* 漂亮的绿色渐变 */
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            border: none;
            border-radius: 50px; /* 圆角胶囊形状 */
            /* 阴影让按钮有立体感 */
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.3);
            /* 点击时的过渡动画 */
            transition: transform 0.1s ease, box-shadow 0.1s ease;
            cursor: pointer;
            /* 确保按钮不会被文字撑变形 */
            white-space: nowrap;
            outline: none;
        }

        /* 按钮按下时的效果 */
        .get-resource-btn:active {
            transform: scale(0.96); /* 微微缩小 */
            box-shadow: 0 4px 10px rgba(16, 185, 129, 0.2); /* 阴影变小 */
        }
    </style>
</head>
<body>

    <!-- 中间的绿色按钮 -->
    <button class="get-resource-btn" id="getBtn">点击获取学习资源</button>

    <script>
        // 获取按钮元素
        const btn = document.getElementById('getBtn');

        // 点击按钮后跳转到 joke.html
        btn.addEventListener('click', function() {
            window.location.href = 'joke.html';
        });
    </script>

</body>
</html>
