<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 浏览器标签栏文字 -->
    <title>高烨炜是gay</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            background: #080818;
            overflow: hidden;
            font-family: sans-serif;
        }
        /* 漂浮文字通用样式 */
        .fly-text {
            position: absolute;
            color: #fff;
            font-size: 22px;
            text-shadow: 0 0 8px #ff44aa;
            white-space: nowrap;
        }
        .heart-wrap {
            position: absolute;
            color: #ff44aa;
            font-size:26px;
            text-shadow:0 0 10px #ff44aa;
        }
    </style>
</head>
<body>
    <script>
        // 创建随机乱飞旋转文字
        function createFlyText(text){
            const el = document.createElement('div');
            el.className = 'fly-text';
            el.innerText = text;
            document.body.appendChild(el);
            const w = window.innerWidth;
            const h = window.innerHeight;
            let x = Math.random()*w;
            let y = Math.random()*h;
            let dx = (Math.random()-0.5)*4;
            let dy = (Math.random()-0.5)*4;
            let rotate = 0;
            let rotateSpeed = (Math.random()-0.5)*3;
            function animate(){
                x += dx;
                y += dy;
                rotate += rotateSpeed;
                if(x < 0 || x > w) dx = -dx;
                if(y < 0 || y > h) dy = -dy;
                el.style.left = x+'px';
                el.style.top = y+'px';
                el.style.transform = `rotate(${rotate}deg)`;
                requestAnimationFrame(animate);
            }
            animate();
        }
        // 创建爱心形状文字
        function createHeartText(){
            const el = document.createElement('div');
            el.className = 'heart-wrap';
            el.innerText = '高烨炜是SB';
            document.body.appendChild(el);
            const w = window.innerWidth;
            const h = window.innerHeight;
            let x = Math.random()*(w-100);
            let y = Math.random()*(h-150);
            let dx = (Math.random()-0.5)*2;
            let dy = (Math.random()-0.5)*2;
            let scale = 1;
            let scaleDir = 0.01;
            function animate(){
                x += dx;
                y += dy;
                scale += scaleDir;
                if(scale>1.3 || scale<0.7) scaleDir=-scaleDir;
                if(x <0 || x>w-100) dx=-dx;
                if(y<0 || y>h-100) dy=-dy;
                el.style.left = x+'px';
                el.style.top = y+'px';
                el.style.transform = `scale(${scale})`;
                requestAnimationFrame(animate);
            }
            animate();
        }
        // 生成一堆文字
        for(let i=0;i<12;i++){
            createFlyText("高烨炜是福瑞");
        }
        for(let i=0;i<5;i++){
            createHeartText();
        }
    </script>
</body>
</html>
